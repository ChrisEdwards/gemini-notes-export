version: "2"
run:
  timeout: 5m
  tests: false
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G104 # unhandled errors; errcheck covers this with its exclude list
    misspell:
      locale: US
issues:
  uniq-by-line: true
